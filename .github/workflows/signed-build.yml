name: Optional signed evaluation build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-evaluation
  cancel-in-progress: false

jobs:
  signed:
    # Disabled until an eligible publisher and protected environment are configured.
    if: github.ref == 'refs/heads/main' && vars.CODE_SIGNING_ENABLED == 'true'
    environment: signed-builds
    runs-on: [self-hosted, Windows, X64, clippboard-signing]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Clippboard.slnx --locked-mode
      - run: ./scripts/dev.ps1 test
      - run: ./scripts/dev.ps1 publish
      - name: Sign app, setup and embedded uninstaller
        env:
          CLIPPBOARD_CERTIFICATE: ${{ vars.CODE_SIGNING_THUMBPRINT }}
          CLIPPBOARD_SIGNTOOL: ${{ vars.CODE_SIGNING_TOOL_PATH }}
        run: |
          if (!$env:CLIPPBOARD_CERTIFICATE -or !$env:CLIPPBOARD_SIGNTOOL) { throw 'Signing configuration is incomplete.' }
          ./scripts/package.ps1 -SkipPublish -CertificateThumbprint $env:CLIPPBOARD_CERTIFICATE -SignToolPath $env:CLIPPBOARD_SIGNTOOL
      - run: ./scripts/verify-package.ps1 -RequireSigned
      - run: ./scripts/test-installer.ps1 -RequireSigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippboard-windows-x64-signed-evaluation
          path: |
            artifacts/portable/win-x64/Clippboard.exe
            artifacts/installer/*.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-info.json
            artifacts/installer-tests/installed-preview.png
          if-no-files-found: error
          retention-days: 14
