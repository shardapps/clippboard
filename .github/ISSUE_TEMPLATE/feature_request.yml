name: Feature request
description: Describe a useful improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your proposed experience
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives and resource/privacy tradeoffs
