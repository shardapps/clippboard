<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
 <title id="title">Clippboard — good things are worth keeping</title>
 <desc id="desc">White and cream paper notes hanging from a thick rope on a pale cloud background.</desc>
 <defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#CBD4ED"/></pattern><filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".2"/></filter></defs>
 <rect width="1440" height="640" rx="32" fill="#F7F9FE"/><rect width="1440" height="640" rx="32" fill="url(#dots)" opacity=".45"/>
 <g font-family="Segoe UI, Arial, sans-serif">
  <rect x="68" y="64" width="155" height="34" rx="17" fill="#E9EEFF"/><text x="89" y="86" font-size="13" fill="#526DCC" letter-spacing="2">SHARD APPS</text>
  <text x="68" y="197" font-size="79" font-weight="700" fill="#273146" letter-spacing="-4">clippboard</text>
  <text x="70" y="250" font-size="24" fill="#69758A">Good things are worth keeping.</text>
  <text x="70" y="327" font-size="19" fill="#69758A">Your text, images and files.</text><text x="70" y="359" font-size="19" fill="#69758A">A little line for everything you copy.</text>
  <rect x="70" y="413" width="256" height="59" rx="16" fill="#E9EEFF"/><text x="93" y="450" font-size="20" font-weight="600" fill="#273146">Ctrl + Shift + V</text>
  <text x="70" y="557" font-size="14" fill="#69758A" letter-spacing="2">WINDOWS · OPEN SOURCE · LOCAL FIRST</text>
 </g>
 <path d="M570 90 Q990 232 1490 88" fill="none" stroke="#ceb185" stroke-width="9"/>
 <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
  <g transform="translate(625 158) rotate(-6)"><rect width="221" height="270" rx="25" fill="#FFFFFF"/><rect x="102" y="-32" width="18" height="62" rx="5" fill="#bb9162" stroke="#86603d" stroke-width="2"/><text x="26" y="63" font-size="12" fill="#6e7967" letter-spacing="2">TEXT</text><text x="26" y="110" font-size="23" fill="#273146" font-weight="600">An idea worth</text><text x="26" y="140" font-size="23" fill="#273146" font-weight="600">holding onto.</text><path d="M26 178H178 M26 200H166 M26 222H122" stroke="#c7cbb5" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(870 181) rotate(4)"><rect width="221" height="270" rx="25" fill="#FFFFFF"/><rect x="102" y="-32" width="18" height="62" rx="5" fill="#bb9162" stroke="#86603d" stroke-width="2"/><text x="26" y="63" font-size="12" fill="#6e7967" letter-spacing="2">IMAGE</text><rect x="25" y="84" width="171" height="139" rx="15" fill="#D6E0F5"/><circle cx="156" cy="116" r="16" fill="#f4dfaf"/><path d="M25 201L79 135L135 207L167 163L196 208V223H25Z" fill="#6D7FB1"/></g>
  <g transform="translate(1117 151) rotate(-3)"><rect width="221" height="270" rx="25" fill="#FFFAF1"/><rect x="102" y="-32" width="18" height="62" rx="5" fill="#bb9162" stroke="#86603d" stroke-width="2"/><text x="26" y="63" font-size="12" fill="#706576" letter-spacing="2">FILES</text><path d="M30 99H84L97 112H186V185H30Z" fill="#b7a3c5"/><text x="27" y="226" font-size="17" fill="#514258">the-next-big-thing.zip</text></g>
 </g>
 <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#69758A"><text x="682" y="538">Copy it.</text><text x="931" y="538">Keep it.</text><text x="1168" y="538">Find it again.</text></g>
</svg>
