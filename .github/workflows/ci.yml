name: Store layout startup comparison

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.cache\nuget

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download verified normal Store ingestion build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-store
          run-id: 38928887370
          path: input-normal
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Download verified application-only precompiled Store build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-store
          run-id: 38929075942
          path: input-r2r
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Verify and extract isolated comparison layouts without installing
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Isolated runner required.' }
          foreach ($variant in @('normal','r2r')) {
            $packages = @(Get-ChildItem -LiteralPath "input-$variant" -Filter '*.msix' -Recurse)
            if ($packages.Count -ne 1) { throw 'Expected one previously verified package.' }
            ./scripts/verify-store-package.ps1 -Path $packages[0].FullName
            [IO.Compression.ZipFile]::ExtractToDirectory($packages[0].FullName, (Join-Path (Get-Location) "evaluation-$variant"))
          }
      - name: Compare loose self-contained layouts on the same runner
        timeout-minutes: 4
        run: |
          function Invoke-Profile([string]$Variant) {
            $exe = Join-Path (Get-Location) "evaluation-$Variant/app/Clippboard.exe"
            $process = Start-Process -FilePath $exe -ArgumentList @('--lifecycle-diagnostics', "artifacts/overlay-lifecycle-store-$Variant.json") -WindowStyle Hidden -PassThru
            try {
              if (!$process.WaitForExit(120000)) { $process.Kill($true); throw 'Profile process timed out.' }
              if ($process.ExitCode -ne 0) { throw "Profile failed: $Variant exit=$($process.ExitCode)" }
            } finally { $process.Dispose() }
          }
          Invoke-Profile 'normal'
          Invoke-Profile 'r2r'
      - name: Preserve layout comparison reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-layout-comparison
          path: artifacts/overlay-lifecycle-store*.json
          if-no-files-found: error
          retention-days: 14
