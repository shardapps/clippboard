name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.cache\nuget

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore Clippboard.slnx --locked-mode
      - name: Compile with warnings as errors
        run: dotnet build Clippboard.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Storage, format and WPF regression checks
        run: ./scripts/dev.ps1 test
      - name: Signing and packaging failure guards
        run: ./scripts/test-packaging-guards.ps1
      - name: Overlay process lifecycle with hardware and software rendering
        shell: pwsh
        run: |
          ./scripts/dev.ps1 lifecycle
          Move-Item -LiteralPath artifacts/overlay-lifecycle.json -Destination artifacts/overlay-lifecycle-hardware.json
          ./scripts/dev.ps1 lifecycle -Software
      - name: Publish portable executable
        run: ./scripts/dev.ps1 publish
      - name: Native listener, hotkey, overlay, accepted paste and restart
        run: dotnet run --project tests/Clippboard.Core.Tests -c Release --no-build -- --session artifacts/portable/win-x64/Clippboard.exe artifacts/session-checks/report.json
      - name: Build per-user installer
        run: ./scripts/package.ps1 -SkipPublish
      - name: Verify checksums and signature metadata
        run: ./scripts/verify-package.ps1
      - name: Isolated install, reinstall, native startup and uninstall
        run: ./scripts/test-installer.ps1
      - name: Build and validate Microsoft Store MSIX
        run: ./scripts/store-package.ps1
      - name: Verify Store identity, contents and checksums
        run: ./scripts/verify-store-package.ps1
      - name: Upload testing builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippboard-windows-x64-alpha
          path: |
            artifacts/portable/win-x64/Clippboard.exe
            artifacts/installer/*.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-info.json
            artifacts/installer-tests/installed-preview.png
            artifacts/overlay-lifecycle*.json
            artifacts/session-checks/report.json
            artifacts/store/**/*.msix
            artifacts/store/**/package-info.json
          if-no-files-found: error
          retention-days: 14
