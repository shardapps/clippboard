name: ReadyToRun comparison

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.cache\nuget

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download the exact normal and precompiled builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-input
          run-id: 38926477334
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Verify compiled evaluation input
        run: ./scripts/verify-package.ps1
      - name: Same-runner normal and precompiled lifecycle comparison
        timeout-minutes: 5
        run: |
          function Invoke-Profile([string]$Executable, [string]$Output) {
            $process = Start-Process -FilePath $Executable -ArgumentList @('--lifecycle-diagnostics', $Output) -WindowStyle Hidden -PassThru
            try {
              if (!$process.WaitForExit(120000)) { $process.Kill($true); throw 'Profile process timed out.' }
              if ($process.ExitCode -ne 0) { throw "Profile failed: $Executable exit=$($process.ExitCode)" }
            } finally { $process.Dispose() }
          }
          Invoke-Profile './artifacts/portable-baseline/win-x64/Clippboard.exe' 'artifacts/overlay-lifecycle-baseline-default.json'
          Invoke-Profile './artifacts/portable/win-x64/Clippboard.exe' 'artifacts/overlay-lifecycle-r2r-default.json'
      - name: Preserve comparison reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ready-to-run-comparison
          path: artifacts/overlay-lifecycle*.json
          if-no-files-found: error
          retention-days: 14
